// Difficulty presets of RealTPS.
//
// A save picks one preset in the game's difficulty options (Thermal Protection column): Friendly, Realistic,
// Strict or Custom. The three named presets take their values from this node every time the game reads them;
// Custom uses the save's own sliders.
//
// The presets change only the damage model, never the material physics.
// Every number here is a calibration, not a measurement.
//
// Keys of a PRESET (each optional; a key that is left out keeps the built-in value):
//   damage              true/false  cells lose integrity when the surface or the bond behind it gets too hot
//   damageRate          0.25 - 3    multiplier on every damage rate
//   surfaceDamageTime   2 - 60 s    time to destroy a cell whose surface is held at the material's fallback limit
//   bondDamageTime      10 - 600 s  time to fail a bond held at its limit
//   structureDamageTime 2 - 60 s    time to fail exposed structure held at twice its limit
//   failure             true/false  hot structure behind exposed cells ends in the failure of the whole shield
//   breachHeat          true/false  part of the heat on exposed cells reaches the part behind the shield
//   breachShare         0 - 1       that part (0.5 = half)
//   cellVariation       0 - 0.10    fixed difference between the limits of the cells of one shield (0.02 = 2 %)
// Out-of-range values are clamped and logged; unknown keys are ignored and logged.
//
// easy / normal / moderate / hard: the preset a new game takes for each stock difficulty level.
//
// Players and other mods can retune a preset with ModuleManager, for example to make bond failure slower:
//
//   @RTPS_DIFFICULTY:AFTER[RealTPS]
//   {
//       @PRESET[Realistic]
//       {
//           @bondDamageTime = 120
//       }
//   }
//
// A further RTPS_DIFFICULTY node also works: its keys override this one's, key by key.

RTPS_DIFFICULTY
{
	easy = Friendly
	normal = Realistic
	moderate = Realistic
	hard = Strict

	PRESET
	{
		name = Friendly
		damage = true
		damageRate = 0.5
		surfaceDamageTime = 8
		bondDamageTime = 60
		structureDamageTime = 10
		failure = true
		breachHeat = true
		breachShare = 0.25
		cellVariation = 0
	}
	PRESET
	{
		name = Realistic
		damage = true
		damageRate = 1
		surfaceDamageTime = 8
		bondDamageTime = 60
		structureDamageTime = 10
		failure = true
		breachHeat = true
		breachShare = 0.5
		cellVariation = 0.02
	}
	PRESET
	{
		name = Strict
		damage = true
		damageRate = 1.5
		surfaceDamageTime = 8
		bondDamageTime = 60
		structureDamageTime = 10
		failure = true
		breachHeat = true
		breachShare = 0.75
		cellVariation = 0.05
	}
}
