// RealTPS - rigid ablators.
//
// These consume material: pyrolysed mass carries heat away (ABLATION), and char can be stripped by
// dynamic pressure without any cooling (EROSION).
// Units are SI. Where each number comes from: docs/sources/MATERIAL_SOURCES.md (change a number there too).
// Field reference: docs/wiki/Modding.md.
// designThickness, the ABLATION rate law, heatOfAblation, shear limits and costs are gameplay calibrations
// anchored to the literature ordering, not measured material constants.

RTPS_MATERIAL
{
	id = cork-phenolic
	displayName = #LOC_RTPS_mat_cork_phenolic_title
	description = #LOC_RTPS_mat_cork_phenolic_desc
	family = rigid_ablative
	permittedHostClasses = rigid_disc, integral_pod
	density = 480
	designThickness = 0.060
	specificHeat = 2100
	emissivity = 0.70
	charEmissivity = 0.85
	maxSurfaceTemp = 1900
	conductivity = 0.065
	bondLimitTemp = 520
	costPerKg = 1.0
	ABLATION
	{
		resource = RtpsCorkAblator
		onsetTemp = 550
		activationTemp = 8000
		rateCoefficient = 13
		heatOfAblation = 6.0e6
	}
	EROSION
	{
		shearLimit = 30000
		shearRate = 0.05
	}
}

