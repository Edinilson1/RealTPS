// PICA made on a flexible carbon felt instead of rigid FiberForm: lower conductivity and higher strain to failure,
// so it bonds directly to curved structures in large pieces (offered on the integral pods too). The layer is
// thinner than PICA's for better insulation at less mass, and so holds less material to burn.
