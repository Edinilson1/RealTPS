// RealTPS - deployable radiative fabrics.
//
// Carbon cloth on a deployable frame: it radiates, and its wear layer is lost to shear and to oxidation
// without any cooling.
// Units are SI. Where each number comes from: docs/sources/MATERIAL_SOURCES.md (change a number there too).

RTPS_MATERIAL
{
	id = adept-carbon-fabric
	displayName = #LOC_RTPS_mat_adept_carbon_fabric_title
	description = #LOC_RTPS_mat_adept_carbon_fabric_desc
	family = deployable_radiative
	permittedHostClasses = deployable_rib_fabric, inflatable_blanket
	density = 880
	designThickness = 0.00254
	dryArealDensity = 1.0
	specificHeat = 1100
	emissivity = 0.90
	maxSurfaceTemp = 2400
	conductivity = 5
	bondLimitTemp = 900
	costPerKg = 220
	costPerArea = 300
	techNode = aerospaceTech
	unlockCost = 26000
	EROSION
	{
		resource = RtpsAdeptFabric
		shearLimit = 60000
		shearRate = 0.02
		oxidationOnsetTemp = 1100
		oxidationActivationTemp = 14000
		oxidationRate = 9
	}
}
