// RealTPS - rigid reusable surfaces (tiles, hot structures).
//
// Nothing is consumed for cooling: protection is reradiation (emissivity and a surface temperature limit)
// plus insulation. A wear layer, where one exists, is removed by an EROSION channel that never cools.
// Units are SI. Where each number comes from: docs/sources/MATERIAL_SOURCES.md (change a number there too).

