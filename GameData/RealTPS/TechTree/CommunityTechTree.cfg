// Unlock nodes that are different when Community Tech Tree is installed.
//
// Every material states one `techNode` in its profile (Materials/*.cfg): that is its node in the stock tree,
// and MaterialUnlocks.cfg (generated) creates its unlock there. This file only moves some of those unlocks,
// and only when Community Tech Tree is installed. A material not listed here keeps its `techNode`.

@PARTUPGRADE[RTPS_phenolic_fiberglass]:NEEDS[RealTPSRuntime&B9PartSwitch&CommunityTechTree]:FOR[RealTPS]
{
	@techRequired = enhancedSurvivability
}

@PARTUPGRADE[RTPS_heeet]:NEEDS[RealTPSRuntime&B9PartSwitch&CommunityTechTree]:FOR[RealTPS]
{
	@techRequired = aerospaceComposites
}

@PARTUPGRADE[RTPS_intumescent_composite]:NEEDS[RealTPSRuntime&B9PartSwitch&CommunityTechTree&!RealTPSNoSpeculative]:FOR[RealTPS]
{
	@techRequired = advAerospaceEngineering
}

@PARTUPGRADE[RTPS_ftps_aerogel_gen3]:NEEDS[RealTPSRuntime&B9PartSwitch&CommunityTechTree&!RealTPSNoSpeculative]:FOR[RealTPS]
{
	@techRequired = aerospaceComposites
}
