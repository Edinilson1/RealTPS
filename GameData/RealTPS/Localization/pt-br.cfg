		// ----- materiais: ablativos rígidos -----
		#LOC_RTPS_mat_cork_phenolic_title = Cortiça Fenólica
		#LOC_RTPS_mat_cork_phenolic_desc = Cortiça moída em resina fenólica. Barata, leve e disponível desde o primeiro dia. Boa para saltos suborbitais e órbita baixa; queima por completo em qualquer coisa mais rápida, e sua camada carbonizada se solta em desacelerações fortes.
		#LOC_RTPS_mat_cork_phenolic_detail = <b>Construção:</b> ablativo rígido\n<b>Base:</b> histórico\n<b>Limite da superfície:</b> 1900 K\n<b>Limite da cola:</b> 520 K\n<b>Espessura de referência:</b> 60 mm\n<b>Condutividade:</b> 0,065 W/(m·K)\n<b>Massa por área:</b> 28,8 kg/m² consumível\n<b>Calor removido:</b> 6 MJ/kg\n<b>Erosão acima de:</b> 30 kPa
		#LOC_RTPS_mat_phenolic_fiberglass_title = Fibra de Vidro Fenólica
		#LOC_RTPS_mat_phenolic_fiberglass_desc = Tecido de vidro laminado com resina fenólica, o escudo das primeiras cápsulas. Pesado e deixa passar bastante calor para a estrutura. Sobrevive a um retorno íngreme da Mun; num retorno longo e raso a camada fina que sobra deixa a cola superaquecer.
		#LOC_RTPS_mat_phenolic_fiberglass_detail = <b>Construção:</b> ablativo rígido\n<b>Base:</b> histórico\n<b>Limite da superfície:</b> 2300 K\n<b>Limite da cola:</b> 520 K\n<b>Espessura de referência:</b> 28 mm\n<b>Condutividade:</b> 0,35 W/(m·K)\n<b>Massa por área:</b> 49 kg/m² consumível\n<b>Calor removido:</b> 8 MJ/kg
		#LOC_RTPS_mat_avcoat_5026_39_title = Avcoat em Colmeia
		#LOC_RTPS_mat_avcoat_5026_39_desc = Ablator epóxi-novolac injetado em uma colmeia de fibra de vidro colada ao escudo. O padrão de retorno lunar: aguenta retornos da Mun e interplanetários com margem, a um peso moderado.
		#LOC_RTPS_mat_avcoat_5026_39_detail = <b>Construção:</b> ablativo rígido\n<b>Base:</b> comprovado em voo\n<b>Limite da superfície:</b> 2900 K\n<b>Limite da cola:</b> 520 K\n<b>Espessura de referência:</b> 60 mm\n<b>Condutividade:</b> 0,242 W/(m·K)\n<b>Massa por área:</b> 31,7 kg/m² consumível + 2 kg/m² fixa\n<b>Calor removido:</b> 12 MJ/kg\n<b>Erosão acima de:</b> 90 kPa
		#LOC_RTPS_mat_sla_561v_title = SLA-561V
		#LOC_RTPS_mat_sla_561v_desc = Ablator muito leve de silicone e cortiça em colmeia. Feito para entradas suaves em atmosferas finas. Sofre erosão rápida quando a pressão dinâmica sobe: evite entradas íngremes ou pesadas.
		#LOC_RTPS_mat_sla_561v_detail = <b>Construção:</b> ablativo rígido\n<b>Base:</b> comprovado em voo\n<b>Limite da superfície:</b> 2100 K\n<b>Limite da cola:</b> 523 K\n<b>Espessura de referência:</b> 60 mm\n<b>Condutividade:</b> 0,059 W/(m·K)\n<b>Massa por área:</b> 15,8 kg/m² consumível + 1,5 kg/m² fixa\n<b>Calor removido:</b> 9 MJ/kg\n<b>Erosão acima de:</b> 20 kPa
		#LOC_RTPS_mat_carbon_phenolic_title = Carbono Fenólico
		#LOC_RTPS_mat_carbon_phenolic_desc = Tecido de carbono denso com resina fenólica. Quase nada o destrói e ele mal recua, mas é a opção mais pesada e conduz calor para o que estiver atrás dele.
		#LOC_RTPS_mat_carbon_phenolic_detail = <b>Construção:</b> ablativo rígido\n<b>Base:</b> comprovado em voo\n<b>Limite da superfície:</b> 3600 K\n<b>Limite da cola:</b> 560 K\n<b>Espessura de referência:</b> 45 mm\n<b>Condutividade:</b> 1 W/(m·K)\n<b>Massa por área:</b> 65,3 kg/m² consumível\n<b>Calor removido:</b> 26 MJ/kg
		#LOC_RTPS_mat_sirca_15_title = SIRCA-15
		#LOC_RTPS_mat_sirca_15_desc = Telha cerâmica impregnada com silicone. Extremamente leve e ótimo isolante, usinada em telhas pequenas; por isso só escudos pequenos podem usá-la. Para sondas leves em velocidade orbital.
		#LOC_RTPS_mat_sirca_15_detail = <b>Construção:</b> ablativo rígido\n<b>Base:</b> comprovado em voo\n<b>Limite da superfície:</b> 2000 K\n<b>Limite da cola:</b> 530 K\n<b>Espessura de referência:</b> 40 mm\n<b>Condutividade:</b> 0,059 W/(m·K)\n<b>Massa por área:</b> 9,6 kg/m² consumível\n<b>Calor removido:</b> 10 MJ/kg\n<b>Erosão acima de:</b> 35 kPa
		#LOC_RTPS_mat_pica_title = PICA
		#LOC_RTPS_mat_pica_desc = Ablator de carbono impregnado com fenólico. Um quarto da densidade do carbono fenólico com quase a mesma capacidade térmica. Excelente para naves leves em retornos rápidos. Numa cápsula pesada a camada leve fica fina em entradas longas, e o calor que volta depois ainda pode superaquecer a cola.
		#LOC_RTPS_mat_pica_detail = <b>Construção:</b> ablativo rígido\n<b>Base:</b> comprovado em voo\n<b>Limite da superfície:</b> 3300 K\n<b>Limite da cola:</b> 523 K\n<b>Espessura de referência:</b> 70 mm\n<b>Condutividade:</b> 0,305 W/(m·K)\n<b>Massa por área:</b> 16,5 kg/m² consumível + 1 kg/m² fixa\n<b>Calor removido:</b> 20 MJ/kg\n<b>Erosão acima de:</b> 130 kPa
		#LOC_RTPS_mat_heeet_title = HEEET
		#LOC_RTPS_mat_heeet_desc = Ablator de carbono tecido em três dimensões com uma camada isolante por baixo. Aguenta aquecimento e pressão extremos com pouco recuo e passa pouco calor para dentro. Os painéis tecidos exigem um escudo de 1,25 m ou maior.
		#LOC_RTPS_mat_heeet_detail = <b>Construção:</b> ablativo rígido\n<b>Base:</b> experimental\n<b>Limite da superfície:</b> 3600 K\n<b>Limite da cola:</b> 530 K\n<b>Espessura de referência:</b> 40 mm\n<b>Condutividade:</b> 0,4 W/(m·K)\n<b>Massa por área:</b> 32,8 kg/m² consumível + 1,5 kg/m² fixa\n<b>Calor removido:</b> 30 MJ/kg\n<b>Erosão acima de:</b> 500 kPa
		#LOC_RTPS_mat_intumescent_composite_title = Compósito Intumescente (fictício)
		#LOC_RTPS_mat_intumescent_composite_desc = Um revestimento fino que incha e vira uma espuma isolante carbonizada ao ser aquecido. Material fictício inspirado em alegações do tipo 'Starlite'; a expansão em si não é simulada. Levíssimo e isolante excepcional, mas a espuma é frágil sob pressão dinâmica.
		#LOC_RTPS_mat_intumescent_composite_detail = <b>Construção:</b> ablativo rígido\n<b>Base:</b> fictício (especulativo)\n<b>Limite da superfície:</b> 2600 K\n<b>Limite da cola:</b> 520 K\n<b>Espessura de referência:</b> 16 mm\n<b>Condutividade:</b> 0,05 W/(m·K)\n<b>Massa por área:</b> 14,4 kg/m² consumível\n<b>Calor removido:</b> 22 MJ/kg\n<b>Erosão acima de:</b> 40 kPa

		// ----- materiais: reutilizáveis, flexíveis -----
		#LOC_RTPS_mat_silica_tile_li900_title = Telha de Sílica LI-900
		#LOC_RTPS_mat_silica_tile_li900_desc = Telhas de fibra de sílica revestidas. Nada é consumido: elas rejeitam calor irradiando. Isolamento excelente e nenhuma manutenção, mas limite de temperatura baixo: acima de uns 1640 K a superfície amolece e as telhas começam a falhar em segundos. Só para veículos leves em escudos grandes ou entradas lentas. Peça provisória: as telhas reais forram a barriga de um veículo alado; os escudos stock as carregam até existir um painel de telhas.
		#LOC_RTPS_mat_silica_tile_li900_detail = <b>Construção:</b> superfície rígida reutilizável\n<b>Base:</b> comprovado em voo\n<b>Limite da superfície:</b> 1760 K\n<b>Limite de reuso:</b> 1590 K\n<b>Dano na superfície acima de:</b> 1644 K\n<b>Limite da cola:</b> 533 K\n<b>Espessura de referência:</b> 60 mm\n<b>Condutividade:</b> 0,048 W/(m·K)\n<b>Massa por área:</b> 11 kg/m² fixa
		#LOC_RTPS_mat_tufroc_title = TUFROC
		#LOC_RTPS_mat_tufroc_desc = Capa de carbono endurecido sobre isolante de sílica. Superfície reutilizável que aguenta mais calor que telhas comuns, com massa e custo bem maiores. Ainda assim não substitui um ablator em uma cápsula densa. Peça provisória: o TUFROC real cobre narizes e bordos de ataque de asas; os escudos stock o carregam até existir uma peça assim.
		#LOC_RTPS_mat_tufroc_detail = <b>Construção:</b> superfície rígida reutilizável\n<b>Base:</b> comprovado em voo\n<b>Limite da superfície:</b> 1970 K\n<b>Dano na superfície acima de:</b> 1870 K\n<b>Limite da cola:</b> 533 K\n<b>Espessura de referência:</b> 60 mm\n<b>Condutividade:</b> 0,2 W/(m·K)\n<b>Massa por área:</b> 26 kg/m² fixa
		#LOC_RTPS_mat_ftps_nextel_gen1_title = Manta de Tecido Cerâmico (Ger. 1)
		#LOC_RTPS_mat_ftps_nextel_gen1_desc = Tecido de alumina-sílica sobre feltro isolante e barreira de gás. A proteção flexível básica de um desacelerador inflável: serve para cargas leves vindas de órbita baixa, e nada além disso.
		#LOC_RTPS_mat_ftps_nextel_gen1_detail = <b>Construção:</b> manta isolante flexível\n<b>Base:</b> comprovado em voo\n<b>Limite da superfície:</b> 1800 K\n<b>Limite da cola:</b> 523 K\n<b>Espessura de referência:</b> 16 mm\n<b>Condutividade:</b> 0,1 W/(m·K)\n<b>Massa por área:</b> 4 kg/m² fixa
		#LOC_RTPS_mat_ftps_sic_gen2_title = Manta de Carbeto de Silício (Ger. 2)
		#LOC_RTPS_mat_ftps_sic_gen2_desc = Tecido externo de carbeto de silício sobre feltro de carbono e aerogel. Tolera claramente mais aquecimento que o tecido cerâmico e mantém a estrutura inflável mais fria.
		#LOC_RTPS_mat_ftps_sic_gen2_detail = <b>Construção:</b> manta isolante flexível\n<b>Base:</b> comprovado em voo\n<b>Limite da superfície:</b> 1970 K\n<b>Limite da cola:</b> 673 K\n<b>Espessura de referência:</b> 20 mm\n<b>Condutividade:</b> 0,07 W/(m·K)\n<b>Massa por área:</b> 6 kg/m² fixa
		#LOC_RTPS_mat_ftps_aerogel_gen3_title = Manta Avançada de Aerogel (Ger. 3, teórica)
		#LOC_RTPS_mat_ftps_aerogel_gen3_desc = Um sistema flexível projetado de terceira geração com camadas de aerogel opacificado. Teórico: nenhuma manta assim voou. A opção flexível mais capaz, ainda muito abaixo de um ablator rígido.
		#LOC_RTPS_mat_ftps_aerogel_gen3_detail = <b>Construção:</b> manta isolante flexível\n<b>Base:</b> teórico (especulativo)\n<b>Limite da superfície:</b> 2150 K\n<b>Limite da cola:</b> 750 K\n<b>Espessura de referência:</b> 18 mm\n<b>Condutividade:</b> 0,04 W/(m·K)\n<b>Massa por área:</b> 3,2 kg/m² fixa

		// ----- materiais sem peça hospedeira nesta versão -----
		#LOC_RTPS_mat_reinforced_carbon_carbon_title = Carbono-Carbono Reforçado
		#LOC_RTPS_mat_reinforced_carbon_carbon_desc = Estrutura quente para narizes e bordos de ataque. Suporta a carga e irradia o calor; o revestimento oxida lentamente acima do limite de reuso. Peça provisória: os escudos stock o carregam até existir uma peça de ponta de nariz ou bordo de ataque, com isolamento por trás.
		#LOC_RTPS_mat_reinforced_carbon_carbon_detail = <b>Construção:</b> superfície rígida reutilizável\n<b>Base:</b> comprovado em voo\n<b>Limite da superfície:</b> 2030 K\n<b>Limite de reuso:</b> 1920 K\n<b>Limite da cola:</b> 2030 K\n<b>Espessura de referência:</b> 0,8 mm\n<b>Condutividade:</b> 3,89 W/(m·K)\n<b>Massa por área:</b> 1,3 kg/m² consumível + 10 kg/m² fixa\n<b>Oxida acima de:</b> 1920 K em atmosferas com oxigênio
		#LOC_RTPS_mat_adept_carbon_fabric_title = Tecido de Carbono (ADEPT)
		#LOC_RTPS_mat_adept_carbon_fabric_desc = Tecido de carbono esticado sobre nervuras desdobráveis. Irradia pelas duas faces e oxida lentamente no ar. Peça provisória: o escudo inflável stock faz o papel do guarda-chuva de nervuras, que não são modeladas, até existir uma peça própria.
		#LOC_RTPS_mat_adept_carbon_fabric_detail = <b>Construção:</b> tecido radiativo desdobrável\n<b>Base:</b> experimental\n<b>Limite da superfície:</b> 2400 K\n<b>Limite da cola:</b> 2400 K\n<b>Espessura de referência:</b> 2,5 mm\n<b>Condutividade:</b> 5 W/(m·K)\n<b>Massa por área:</b> 2,2 kg/m² consumível + 1 kg/m² fixa\n<b>Erosão acima de:</b> 60 kPa\n<b>Oxida acima de:</b> 1100 K em atmosferas com oxigênio
		#LOC_RTPS_mat_uhtc_zrb2_sic_title = UHTC (ZrB2-SiC)
		#LOC_RTPS_mat_uhtc_zrb2_sic_desc = Cerâmica de ultra-alta temperatura para bordos de ataque afiados. Muito densa e frágil; forma uma camada de óxido que se perde nas temperaturas mais altas. Peça provisória: os dois escudos stock pequenos a carregam até existir uma peça de estrutura quente com borda afiada.
		#LOC_RTPS_mat_uhtc_zrb2_sic_detail = <b>Construção:</b> superfície rígida reutilizável\n<b>Base:</b> experimental\n<b>Limite da superfície:</b> 2600 K\n<b>Limite da cola:</b> 2600 K\n<b>Espessura de referência:</b> 0,6 mm\n<b>Condutividade:</b> 98,7 W/(m·K)\n<b>Massa por área:</b> 3,4 kg/m² consumível + 28 kg/m² fixa\n<b>Oxida acima de:</b> 2100 K em atmosferas com oxigênio
	}
}
