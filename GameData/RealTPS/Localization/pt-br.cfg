		#LOC_RTPS_switcher_plural = materiais de proteção térmica
		#LOC_RTPS_upgrade_basicinfo = Material de proteção térmica
		#LOC_RTPS_manufacturer = RealTPS

		// ----- janela da peça -----
		#LOC_RTPS_ui_material = Material do TPS
		#LOC_RTPS_ui_status = Estado do TPS
		#LOC_RTPS_ui_remaining = TPS restante
		#LOC_RTPS_ui_limit = Limite do TPS
		#LOC_RTPS_ui_sink = Resfriamento por ablação
		#LOC_RTPS_ui_detached = (não é mais oferecido)
