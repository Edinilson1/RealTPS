		#LOC_RTPS_status_unresolved = Iniciando
		#LOC_RTPS_status_legacy = Ablator padrão (nave lançada antes do RealTPS)
		#LOC_RTPS_status_untreated = Escudo inalterado (nave lançada antes do RealTPS)
