// RealTPS - English (required language, and the reference for the others).

Localization
{
	en-us
	{
		// ----- selector, unlocks -----
		#LOC_RTPS_switcher = Thermal protection
		#LOC_RTPS_switcher_plural = thermal protection materials
		#LOC_RTPS_upgrade_basicinfo = Thermal protection material
		#LOC_RTPS_manufacturer = RealTPS

		// ----- part window -----
		#LOC_RTPS_ui_material = TPS material
		#LOC_RTPS_ui_status = TPS status
		#LOC_RTPS_ui_remaining = TPS remaining
		#LOC_RTPS_ui_limit = TPS limit
		#LOC_RTPS_ui_sink = Ablation cooling
		#LOC_RTPS_info = Protected area: <<1>> m²\nThe thermal protection material is chosen in the editor and cannot be changed in flight.

		#LOC_RTPS_status_ready = Ready
		#LOC_RTPS_status_nominal = Nominal
		#LOC_RTPS_status_ablating = Ablating
		#LOC_RTPS_status_depleted = Exhausted - bare structure exposed
		#LOC_RTPS_status_inert = INACTIVE: <<1>>
		#LOC_RTPS_status_unresolved = Starting

		// ----- messages -----
		#LOC_RTPS_msg_unknown_material = unknown material '<<1>>'
		#LOC_RTPS_msg_depleted = <<1>>: thermal protection exhausted!
		#LOC_RTPS_msg_inert = <<1>>: thermal protection INACTIVE (<<2>>)

		// ----- startup check -----
		#LOC_RTPS_startup_title = RealTPS
		#LOC_RTPS_startup_ok = OK
		#LOC_RTPS_startup_more = ... and <<1>> more (see KSP.log, lines starting with [RealTPS]).
		#LOC_RTPS_startup_no_b9 = B9PartSwitch is not installed. Heat shields keep their stock behaviour until it is.
		#LOC_RTPS_startup_no_mm = ModuleManager is not installed. Heat shields keep their stock behaviour until it is.
		#LOC_RTPS_startup_catalogue = <<1>> material profile(s) were rejected. See KSP.log, lines starting with [RealTPS].
		#LOC_RTPS_startup_host = Part <<1>>: <<2>>

		// ----- resources -----
		#LOC_RTPS_res_RtpsCorkAblator = Cork-Phenolic Ablator
		#LOC_RTPS_res_RtpsCorkAblator_abbr = Cork
		#LOC_RTPS_res_RtpsPhenolicFiberglass = Phenolic-Fiberglass Ablator
		#LOC_RTPS_res_RtpsPhenolicFiberglass_abbr = PhFG
		#LOC_RTPS_res_RtpsAvcoat = Honeycomb Epoxy-Novolac Ablator
		#LOC_RTPS_res_RtpsAvcoat_abbr = Avct
		#LOC_RTPS_res_RtpsSla561v = Lightweight Silicone-Cork Ablator
		#LOC_RTPS_res_RtpsSla561v_abbr = SLA
		#LOC_RTPS_res_RtpsCarbonPhenolic = Carbon-Phenolic Ablator
		#LOC_RTPS_res_RtpsCarbonPhenolic_abbr = CPh
		#LOC_RTPS_res_RtpsSirca = Silicone-Impregnated Ceramic Ablator
		#LOC_RTPS_res_RtpsSirca_abbr = SIRCA
		#LOC_RTPS_res_RtpsPica = Phenolic-Impregnated Carbon Ablator
		#LOC_RTPS_res_RtpsPica_abbr = PICA
		#LOC_RTPS_res_RtpsHeeet = Woven Carbon Ablator
		#LOC_RTPS_res_RtpsHeeet_abbr = HEEET

		// ----- materials: rigid ablators -----
		#LOC_RTPS_mat_cork_phenolic_title = Cork-Phenolic
		#LOC_RTPS_mat_cork_phenolic_desc = Ground cork in phenolic resin. Cheap, light and available from the first day. Good for suborbital hops and low orbit; it burns through on anything faster, and its char flakes off under hard deceleration.
		#LOC_RTPS_mat_cork_phenolic_detail = <b>Construction:</b> rigid ablator\n<b>Basis:</b> historical\n<b>Surface limit:</b> 1900 K\n<b>Bond limit:</b> 520 K\n<b>Reference thickness:</b> 60 mm\n<b>Conductivity:</b> 0.065 W/(m·K)\n<b>Areal mass:</b> 28.8 kg/m² consumable\n<b>Heat removed:</b> 6 MJ/kg\n<b>Erodes above:</b> 30 kPa
		#LOC_RTPS_mat_phenolic_fiberglass_title = Phenolic-Fiberglass
		#LOC_RTPS_mat_phenolic_fiberglass_desc = Glass cloth laminated with phenolic resin, the heat shield of the first capsules. Heavy and it lets a lot of heat through to the structure. It survives a steep return from the Mun; on a long, shallow one the thin layer left lets its bond overheat.
		#LOC_RTPS_mat_phenolic_fiberglass_detail = <b>Construction:</b> rigid ablator\n<b>Basis:</b> historical\n<b>Surface limit:</b> 2300 K\n<b>Bond limit:</b> 520 K\n<b>Reference thickness:</b> 28 mm\n<b>Conductivity:</b> 0.35 W/(m·K)\n<b>Areal mass:</b> 49 kg/m² consumable\n<b>Heat removed:</b> 8 MJ/kg
		#LOC_RTPS_mat_avcoat_5026_39_title = Avcoat Honeycomb
		#LOC_RTPS_mat_avcoat_5026_39_desc = Epoxy-novolac ablator gunned into a fibreglass honeycomb bonded to the shield. The lunar-return standard: handles Mun and interplanetary returns with margin for a moderate mass.
		#LOC_RTPS_mat_avcoat_5026_39_detail = <b>Construction:</b> rigid ablator\n<b>Basis:</b> flight-proven\n<b>Surface limit:</b> 2900 K\n<b>Bond limit:</b> 520 K\n<b>Reference thickness:</b> 60 mm\n<b>Conductivity:</b> 0.242 W/(m·K)\n<b>Areal mass:</b> 31.7 kg/m² consumable + 2 kg/m² fixed\n<b>Heat removed:</b> 12 MJ/kg\n<b>Erodes above:</b> 90 kPa
		#LOC_RTPS_mat_sla_561v_title = SLA-561V
		#LOC_RTPS_mat_sla_561v_desc = Very light silicone-cork ablator in a honeycomb. Made for gentle entries into thin atmospheres. It erodes quickly once dynamic pressure climbs, so keep it away from steep or heavy entries.
		#LOC_RTPS_mat_sla_561v_detail = <b>Construction:</b> rigid ablator\n<b>Basis:</b> flight-proven\n<b>Surface limit:</b> 2100 K\n<b>Bond limit:</b> 523 K\n<b>Reference thickness:</b> 60 mm\n<b>Conductivity:</b> 0.059 W/(m·K)\n<b>Areal mass:</b> 15.8 kg/m² consumable + 1.5 kg/m² fixed\n<b>Heat removed:</b> 9 MJ/kg\n<b>Erodes above:</b> 20 kPa
		#LOC_RTPS_mat_carbon_phenolic_title = Carbon-Phenolic
		#LOC_RTPS_mat_carbon_phenolic_desc = Dense carbon cloth and phenolic resin. Almost nothing destroys it and it barely recedes, but it is the heaviest option and conducts heat into whatever sits behind it.
		#LOC_RTPS_mat_carbon_phenolic_detail = <b>Construction:</b> rigid ablator\n<b>Basis:</b> flight-proven\n<b>Surface limit:</b> 3600 K\n<b>Bond limit:</b> 560 K\n<b>Reference thickness:</b> 45 mm\n<b>Conductivity:</b> 1 W/(m·K)\n<b>Areal mass:</b> 65.3 kg/m² consumable\n<b>Heat removed:</b> 26 MJ/kg
		#LOC_RTPS_mat_sirca_15_title = SIRCA-15
		#LOC_RTPS_mat_sirca_15_desc = Silicone-impregnated ceramic tile. Extremely light and a very good insulator, machined as small tiles, so only small shields can carry it. For light probes at orbital speed.
		#LOC_RTPS_mat_sirca_15_detail = <b>Construction:</b> rigid ablator\n<b>Basis:</b> flight-proven\n<b>Surface limit:</b> 2000 K\n<b>Bond limit:</b> 530 K\n<b>Reference thickness:</b> 40 mm\n<b>Conductivity:</b> 0.059 W/(m·K)\n<b>Areal mass:</b> 9.6 kg/m² consumable\n<b>Heat removed:</b> 10 MJ/kg\n<b>Erodes above:</b> 35 kPa
		#LOC_RTPS_mat_pica_title = PICA
		#LOC_RTPS_mat_pica_desc = Phenolic-impregnated carbon ablator. A quarter of the density of carbon-phenolic with nearly its temperature capability. Excellent for light craft on fast returns. On a heavy capsule the light layer runs thin on long entries, and the heat soaking back afterwards can still overheat its bond.
		#LOC_RTPS_mat_pica_detail = <b>Construction:</b> rigid ablator\n<b>Basis:</b> flight-proven\n<b>Surface limit:</b> 3300 K\n<b>Bond limit:</b> 523 K\n<b>Reference thickness:</b> 70 mm\n<b>Conductivity:</b> 0.305 W/(m·K)\n<b>Areal mass:</b> 16.5 kg/m² consumable + 1 kg/m² fixed\n<b>Heat removed:</b> 20 MJ/kg\n<b>Erodes above:</b> 130 kPa
		#LOC_RTPS_mat_heeet_title = HEEET
		#LOC_RTPS_mat_heeet_desc = Three-dimensionally woven carbon ablator with an insulating layer underneath. Takes extreme heating and pressure with little recession and passes little heat inward. Woven panels need a shield of 1.25 m or larger.
		#LOC_RTPS_mat_heeet_detail = <b>Construction:</b> rigid ablator\n<b>Basis:</b> experimental\n<b>Surface limit:</b> 3600 K\n<b>Bond limit:</b> 530 K\n<b>Reference thickness:</b> 40 mm\n<b>Conductivity:</b> 0.4 W/(m·K)\n<b>Areal mass:</b> 32.8 kg/m² consumable + 1.5 kg/m² fixed\n<b>Heat removed:</b> 30 MJ/kg\n<b>Erodes above:</b> 500 kPa

		// ----- materials: reusable, flexible -----
		#LOC_RTPS_mat_silica_tile_li900_title = LI-900 Silica Tile
		#LOC_RTPS_mat_silica_tile_li900_desc = Coated silica-fibre tiles. Nothing is consumed: they reject heat by glowing. Superb insulation and no refurbishment, but a low temperature limit: above about 1640 K the surface softens and the tiles start to fail within seconds. Only for light vehicles on large shields or slow entries. Placeholder part: real tiles line the belly of a winged vehicle; the stock heat shields carry them until a tile panel exists.
		#LOC_RTPS_mat_silica_tile_li900_detail = <b>Construction:</b> rigid reusable surface\n<b>Basis:</b> flight-proven\n<b>Surface limit:</b> 1760 K\n<b>Reuse limit:</b> 1590 K\n<b>Surface damage above:</b> 1644 K\n<b>Bond limit:</b> 533 K\n<b>Reference thickness:</b> 60 mm\n<b>Conductivity:</b> 0.048 W/(m·K)\n<b>Areal mass:</b> 11 kg/m² fixed
		#LOC_RTPS_mat_tufroc_title = TUFROC
		#LOC_RTPS_mat_tufroc_desc = Toughened carbon cap over silica insulation. A reusable surface that takes more heat than plain tiles at a much higher mass and cost. Still no match for an ablator on a dense capsule. Placeholder part: real TUFROC caps noses and wing leading edges; the stock heat shields carry it until such a part exists.
		#LOC_RTPS_mat_tufroc_detail = <b>Construction:</b> rigid reusable surface\n<b>Basis:</b> flight-proven\n<b>Surface limit:</b> 1970 K\n<b>Surface damage above:</b> 1870 K\n<b>Bond limit:</b> 533 K\n<b>Reference thickness:</b> 60 mm\n<b>Conductivity:</b> 0.2 W/(m·K)\n<b>Areal mass:</b> 26 kg/m² fixed
	}
}
