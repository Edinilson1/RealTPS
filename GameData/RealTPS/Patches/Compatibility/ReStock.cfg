// Hand-written compatibility patch for ReStock (not generated).
//
// ReStock remodels the stock inflatable heat shield and renames its opening animation: InflatableHS -> Inflate.
// The plugin would follow it anyway (when no animation has the configured name, a part with only one animation
// uses that one), but naming it here keeps the match exact even if another mod adds a second animation to the part.
//
// It applies only where the part really plays Inflate, so a part kept stock with RestockIgnore keeps the stock name,
// and only to the value RealTPS wrote, so a deployAnimation changed by another patch is left alone.
@PART[InflatableHeatShield]:HAS[@MODULE[ModuleAnimateGeneric]:HAS[#animationName[Inflate]]]:NEEDS[RealTPSRuntime&B9PartSwitch&ReStock]:AFTER[RealTPS]
{
	@MODULE[ModuleRtpsShield]:HAS[#deployAnimation[InflatableHS]]
	{
		@deployAnimation = Inflate
	}
}
