// Source of truth for the stock host enrolment. tools/RtpsTool reads this file together with the material
// profiles and writes GameData/RealTPS/Patches/StockHosts.cfg. This file is not installed.
//
// part              exact internal part name (verified against the KSP 1.12.5 part configs)
// area              protected area in m^2: the Y- drag-cube face of the part from the game's PartDatabase.cfg
// substrateMaxTemp  surface limit of the bare carrier once the shield has failed (gameplay calibration)
// partRole          where breach heat goes: dedicated (a shield and nothing else: to the part behind it) or
//                   multifunction (a pod, a tank: to its own interior). A failed shield always stays on the
//                   vessel and loses its protection; it never separates
// sectors, rings, centerPercent   grid of the protected face: sectors x (rings + 1) bands plus a centre disc
//                   holding centerPercent of the area. A shield keeps the grid it was launched with.
// protectedFace     outward normal of the protected face, part coordinates
// sectorZero        direction on that face towards the middle of sector zero, part coordinates
// backConductance   substrate to interior, W/(m2 K), default 20
// substrateHeatCapacity   plate behind the protection, J/(m2 K), default 7300 (about 3 mm of aluminium)
// structureLimitTemp      limit of the structure the protection is bonded to, K; omitted = the material's
//                   bond limit alone
// deployAnimation, deployedRadius   inflatable or deployable shields: animation name and open radius, m
// materials         ordered; the first entry is the baseline and needs no unlock
//
// Placeholders: RCC, UHTC and the ADEPT fabric need parts that do not exist yet.
// Until they do, these stock parts carry them so that no material is left unusable. RCC is on every rigid shield;
// UHTC, a small sharp-edge ceramic, only on the two small ones; the ADEPT fabric on the inflatable shield. The
// parts they really need, and the other materials whose stock part is only a stand-in for its look and shape:
// docs/wiki/Placeholder-parts.md.

