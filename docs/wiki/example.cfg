// RealTPS - example configuration, with every parameter explained.
//
// DOCUMENTATION ONLY: do not copy this file into GameData as it is. It describes a made-up mod ("MyMod") with a
// made-up shield ("MyModShield1") and two made-up materials. Copy the parts you need into your own file and
// change the values. The full reference is docs/wiki/Modding.md.
//
// Rules for every RealTPS config:
// - SI units (metres, kilograms, kelvin, watts, joules, pascals); decimal point, never a comma.
// - Save as UTF-8 WITHOUT a byte-order mark.
// - Unknown keys and bad values are rejected, never guessed: a rejected material is not offered on any part.
// - An empty list never means "everything".
//
// A unit test (tests/RealTPS.Core.Tests, ShippedConfigTests) reads this file and checks that its two materials
// and its host are valid, so the examples stay correct.


// =====================================================================================================
// 1. A MATERIAL: RTPS_MATERIAL
// Registers a material. On its own it is not selectable anywhere: a host (section 2 or 3) has to list it.
// =====================================================================================================

RTPS_MATERIAL
{
	// --- identity ---
	id = example-ablator                    // stable id: lower-case words joined by '-'. Never rename it once released: saves refer to it
	displayName = Example Ablator            // name in the editor; plain text or a #LOC_ tag. Default: the id
	description = A made-up ablator that shows every key.   // tooltip text; plain text or a #LOC_ tag
	family = rigid_ablative                  // rigid_ablative (burns away), rigid_reusable (tiles, hot structures),
	                                         // flexible_insulating (inflatable blankets) or deployable_radiative (fabric on ribs)
	speculative = false                      // true for a theoretical or fictional material: the GameData/RealTPSNoSpeculative folder
	                                         // removes it, and it must have a techNode. Optional, default false
	permittedHostClasses = rigid_disc        // host classes that may carry it: rigid_disc, integral_pod, inflatable_blanket, or your own token

	// --- the layer ---
	density = 500                            // kg/m3, density of the virgin material
	designThickness = 0.05                   // m, reference thickness of the layer; with density it sets the material per m2 (here 25 kg/m2)
	dryArealDensity = 2.0                    // kg/m2, mass that is never consumed (bond, carrier, honeycomb). Optional, default 0
	specificHeat = 1500                      // J/(kg K), heat capacity of the material (also the resource's hsp)
	conductivity = 0.2                       // W/(m K), through the layer: decides how much heat reaches the bond and the part behind

	// --- the surface ---
	emissivity = 0.80                        // 0-1, how well the virgin surface radiates heat away
	charEmissivity = 0.90                    // 0-1, the same once charred. Optional, default: emissivity
	charSurfaceFraction = 0.05               // 0-1, share of the material burnt before the surface counts as fully charred. Optional, default 0.05

	// --- limits ---
	maxSurfaceTemp = 2500                    // K, skin temperature at which the game destroys the part while the shield still protects
	bondLimitTemp = 520                      // K, limit of the bond (the glue) behind the layer; bond damage starts 100 K below it
	// reuseSurfaceTemp = 1590               // K, optional: above it the material is no longer reusable (reported once)
	// damageSurfaceTemp = 1644              // K, optional: above it the surface itself deteriorates (tiles, fabrics). 0 or omitted = never

	// --- cost and unlock ---
	costPerKg = 2                            // funds per kg of material (the resource's unit cost)
	costPerArea = 40                         // funds per m2 of shield, for the construction
	// techNode = landing                    // tech node of the stock tree that unlocks it. Omitted (as here) = available from the start.
	                                         // The first material of a host must have none
	// unlockCost = 6000                     // funds to buy the unlock in the R&D building (career)

	// How it burns: required for rigid_ablative, not allowed for the other families.
	ABLATION
	{
		resource = MyModAblator               // resource that holds the material; 1 unit = 1 kg; one resource per material.
		                                      // Your mod must define it (RESOURCE_DEFINITION) if it is not a RealTPS one
		onsetTemp = 600                       // K, the material starts to burn above this skin temperature
		activationTemp = 8000                 // K, B in the burn-rate law R * exp(-B / T): higher = burns more abruptly with temperature
		rateCoefficient = 5                   // kg/(m2 s), R in that law
		heatOfAblation = 5.0e6                // J/kg, heat carried away per kg burnt (the "cooling" in the shield window)
	}

	// How it wears without cooling: optional, at most one.
	EROSION
	{
		// resource = MyModAblator            // wear-layer resource; omit it when ABLATION gives one (if both are set they must be equal)
		shearLimit = 50000                    // Pa, dynamic pressure above which char is torn off. Give both shear keys or neither
		shearRate = 0.02                      // kg/(m2 s), loss rate at twice the shear limit
		// oxidationOnsetTemp = 1900          // K, oxidation starts above this temperature, only in an atmosphere with oxygen
		// oxidationActivationTemp = 22000    // K, like activationTemp, for oxidation
		// oxidationRate = 60                 // kg/(m2 s). Give all three oxidation keys or none
	}
}

RTPS_MATERIAL
{
	// A reusable surface: nothing burns, so there is no ABLATION node and no material is consumed.
	id = example-tile
	displayName = Example Tile
	description = A made-up silica tile.
	family = rigid_reusable
	permittedHostClasses = rigid_disc
	requiredHostCapabilities = small_tile_layout   // optional: tokens the host must declare in its capabilities (comma list)
	density = 144
	designThickness = 0.060
	dryArealDensity = 11.0                   // for a reusable surface all of its mass is "dry"
	specificHeat = 628
	conductivity = 0.0476
	emissivity = 0.88
	maxSurfaceTemp = 1760
	reuseSurfaceTemp = 1590
	damageSurfaceTemp = 1644                 // above this the tile surface softens and the cell loses integrity within seconds
	bondLimitTemp = 533
	costPerArea = 900
	techNode = hypersonicFlight              // needs research: it cannot be the first material of a host
	unlockCost = 9000
}


// =====================================================================================================
// 2. A HOST INSIDE THE REALTPS REPOSITORY: RTPS_HOST (data/hosts/<mod>.cfg)
// Not read by the game: `dotnet run --project tools/RtpsTool -- generate` turns it into the part patch of
// section 3 (in GameData/RealTPS/Patches/). Use this to add a part to RealTPS itself.
// =====================================================================================================

RTPS_HOST
{
	part = MyModShield1                      // exact internal part name (the part config's "name ="); no wildcards
	title = My Mod Heat Shield (1.25m)       // used in comments of the generated patch
	needs = MyMod                            // ModuleManager name of the mod that owns the part; the patch only applies when it is installed.
	                                         // Omit for stock parts
	hostClass = rigid_disc                   // matched against each material's permittedHostClasses
	capabilities = small_tile_layout         // optional comma list, matched against requiredHostCapabilities
	partRole = dedicated                     // where breach heat goes: dedicated (a shield: to the part behind it) or
	                                         // multifunction (a pod, a tank: to its own interior). A failed shield always stays on the vessel
	area = 1.27                              // m2, protected area (the stock shields use the bottom face of the part's drag cube)
	substrateMaxTemp = 1100                  // K, the bare part's limit once the shield has failed
	replacesStockAblator = true              // the part has the stock ModuleAblator and Ablator resource: the patch removes them
	stockAblator = 200                       // kg of stock Ablator the part had: its cost is taken off the part's price
	charModuleName = shieldChar              // optional: the part's colour module (ScalarModuleID) that darkens as the material burns
	thicknessFactor = 1                      // optional: scales every material's thickness on this part (the pods use 0.65)
	includedDryArealDensity = 0              // optional, kg/m2: construction mass already counted in the part's own mass
	ownsConductivity = true                  // optional: false when another module of the part already controls its heat conductivity

	// The grid of cells on the protected face (all optional; these are the defaults):
	sectors = 8                              // 4-40 slices around the face
	rings = 2                                // 0-6 extra rings: the face has rings + 1 bands of equal width
	centerPercent = 2                        // 0-100, share of the area in the centre disc
	protectedFace = 0, -1, 0                 // outward direction of the protected face, in part coordinates (the bottom, for the stock shields)
	sectorZero = 1, 0, 0                     // direction on the face towards the middle of cell 1, in part coordinates

	// The construction behind the layer (optional; these are the defaults):
	backConductance = 20                     // W/(m2 K), from the plate behind the layer into the part
	substrateHeatCapacity = 7300             // J/(m2 K), the plate behind the layer (about 3 mm of aluminium)
	// structureLimitTemp = 900              // K, limit of the structure the layer is attached to; omitted = the material's bondLimitTemp alone

	// Inflatable or deployable shields only (give both or neither):
	// deployAnimation = InflatableHS        // the ModuleAnimateGeneric animation that opens the shield
	// deployedRadius = 5                    // m, radius of the face when fully open

	materials = example-ablator, example-tile   // in editor order; the first is the default and must need no unlock
}


// =====================================================================================================
// 3. A HOST FROM ANOTHER MOD, WITHOUT TOUCHING REALTPS: a ModuleManager part patch
// What section 2 generates, written by hand in your own mod. The B9PartSwitch module needs one SUBTYPE per
// material; docs/wiki/Modding.md, section 2, lists what each subtype must contain.
// =====================================================================================================

@PART[MyModShield1]:NEEDS[RealTPSRuntime&B9PartSwitch&MyMod]:FOR[MyMod]
{
	!MODULE[ModuleAblator] {}                // the stock ablator must go: RealTPS refuses a host that still has one
	!RESOURCE[Ablator] {}

	RESOURCE                                 // the first material's resource, so that B9PartSwitch picks it for a new part
	{
		name = MyModAblator
		amount = 31.75                       // kg = 25 kg/m2 x 1.27 m2
		maxAmount = 31.75
	}

	MODULE
	{
		name = ModuleRtpsShield
		hostClass = rigid_disc               // the same keys as section 2, under the module's names:
		hostCapabilities = small_tile_layout // capabilities
		tpsArea = 1.27                       // area
		substrateMaxTemp = 1100
		partRole = dedicated
		sectors = 8
		rings = 2
		centerPercent = 2
		protectedFace = 0, -1, 0
		sectorZero = 1, 0, 0
		legacyAblatorCapacity = 200          // stockAblator: lets craft built before RealTPS keep flying on the old rules
		switcherModuleId = rtpsMaterial      // moduleID of the B9PartSwitch module below
		materialId = example-ablator         // the first material
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = rtpsMaterial
		switcherDescription = #LOC_RTPS_switcher
		SUBTYPE
		{
			name = example-ablator           // the material id
			addedMass = 0.00254              // t, the material's dry mass on this part (2 kg/m2 x 1.27 m2)
			addedCost = 50.8                 // funds, costPerArea x area
			volumeAdded = 31.75              // kg of material
			allowSwitchInFlight = false      // the material is chosen in the editor only
			RESOURCE
			{
				name = MyModAblator
				unitsPerVolume = 1
			}
			MODULE
			{
				IDENTIFIER { name = ModuleRtpsShield }
				DATA { materialId = example-ablator }
			}
		}
		// ...one more SUBTYPE for example-tile, with upgradeRequired = RTPS_example_tile and no RESOURCE
	}
}


// =====================================================================================================
// 4. GLOBAL SETTINGS: RTPS_SETTINGS (any file in GameData)
// =====================================================================================================

RTPS_SETTINGS
{
	telemetryLog = false                     // true: one "[RealTPS] telemetry:" line per second per hot shield in KSP.log (for bug reports)
	researchGatingWhenUpgradesDisabled = true   // with the game's "part upgrades" option off, materials still follow research.
	                                         // false = stock behaviour (everything but the first material stays locked)
}


// =====================================================================================================
// 5. DIFFICULTY: retuning a preset of RTPS_DIFFICULTY (GameData/RealTPS/Difficulty/DifficultyPresets.cfg)
// Every key is optional; out-of-range values are clamped, with a warning in KSP.log.
// =====================================================================================================

@RTPS_DIFFICULTY:AFTER[RealTPS]
{
	@PRESET[Realistic]                       // Friendly, Realistic or Strict
	{
		@bondDamageTime = 120                // 10-600 s: time to fail a bond held at its limit (longer = gentler)
		// damage = true                     // cells lose integrity when the surface or the bond gets too hot
		// damageRate = 1                    // 0.25-3: multiplier on every damage rate
		// surfaceDamageTime = 8             // 2-60 s: time to destroy a cell whose surface is held at maxSurfaceTemp
		// structureDamageTime = 10          // 2-60 s: time to fail exposed structure held at twice its limit
		// failure = true                    // hot structure behind exposed cells ends in the failure of the shield
		// breachHeat = true                 // exposed cells pass heat to what lies behind them
		// breachShare = 0.5                 // 0-1: share of the heat on an exposed cell that is passed on
		// cellVariation = 0.02              // 0-0.10: fixed difference between the limits of the cells of one shield
	}
}


// =====================================================================================================
// 6. ANOTHER TECH TREE: moving an unlock (TechTree/<tree's ModuleManager name>.cfg)
// One patch per material whose node changes. RTPS_ + the material id with '-' written as '_'.
// =====================================================================================================

@PARTUPGRADE[RTPS_example_tile]:NEEDS[RealTPSRuntime&B9PartSwitch&CommunityTechTree]:FOR[RealTPS]
{
	@techRequired = aerospaceComposites      // the node in that tree; must differ from the material's techNode
}
